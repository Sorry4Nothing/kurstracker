  <!-- Right: Crisp Ausbildungsbaum Vector Graphic -->
  <g transform="translate(690, 36)">
    <!-- Diagram Card -->
    <rect x="0" y="0" width="454" height="248" rx="8" fill="#0D1322" stroke="#1E293B" stroke-width="1"/>

    <!-- Diagram Header -->
    <rect x="0" y="0" width="454" height="32" rx="8" fill="#11182B"/>
    <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="0.5">AUSBILDUNGSBAUM // LAGERSPORT &amp; TREKKING</text>
    <circle cx="434" cy="16" r="4" fill="#108A43"/>

    <!-- Vector Paths -->
    <!-- 1. GLK (80, 136) -> LLM (204, 88) -->
    <path d="M 104 136 C 150 136, 150 88, 204 88" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- 2. LLM (294, 88) -> Experte (344, 88) [DIRECT FROM LLM TO EXPERTE] -->
    <path d="M 294 88 L 344 88" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="4 3"/>

    <!-- 3. GLK (80, 136) -> SLK (204, 184) -->
    <path d="M 104 136 C 150 136, 150 184, 204 184" fill="none" stroke="#C41333" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Node 1: GLK (Grundstufe / J+S Leiter) -->
    <g transform="translate(80, 136)">
      <circle cx="0" cy="0" r="24" fill="#0C2518" stroke="#108A43" stroke-width="2"/>
      <circle cx="0" cy="0" r="13" fill="#108A43"/>
      <circle cx="0" cy="0" r="4.5" fill="#FFFFFF"/>
      <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">GLK</text>
      <text x="0" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#86EFAC" text-anchor="middle">J+S Leiter</text>
    </g>

    <!-- Node 2: LLM (Lagerleiter) -->
    <g transform="translate(204, 68)">
      <rect x="0" y="0" width="90" height="40" rx="6" fill="#111B30" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="45" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38BDF8" text-anchor="middle">LLM</text>
      <text x="45" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="600" fill="#93C5FD" text-anchor="middle">Lagerleiter</text>
    </g>

    <!-- Node 3: Experte (Only from LLM!) -->
    <g transform="translate(344, 68)">
      <rect x="0" y="0" width="86" height="40" rx="6" fill="#111726" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 3"/>
      <text x="43" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="middle">Experte</text>
      <text x="43" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="500" fill="#64748B" text-anchor="middle">J+S Experte</text>
